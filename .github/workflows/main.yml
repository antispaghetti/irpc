
name: Build iRPC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iRPC for iPad
        run: |
          xcodebuild \
            -project iRPC.xcodeproj \
            -scheme iRPC \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iRPC app
        uses: actions/upload-artifact@v4
        with:
          name: iRPC-build
          path: build/Build/Products/Release-iphoneos/iRPC.app
